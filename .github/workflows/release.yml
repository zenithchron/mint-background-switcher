name: Publish GitHub Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vMAJOR.MINOR.PATCH tag to publish or repair"
        required: false
        type: string

permissions:
  contents: read

env:
  RELEASE_TOOL_SHA256: "0036eadd7d6c7c9754c9399de1ece4c51ff3891d51e3e2d4d6a341ecc4b68456"

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      candidate: ${{ steps.release.outputs.candidate }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Resolve release tag
        id: release
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [[ -n "${REQUESTED_TAG:-}" ]]; then
            tag="$REQUESTED_TAG"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          else
            version="$(python -I -S - <<'PY'
          from pathlib import Path
          import tomllib

          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          print(data["project"]["version"])
          PY
          )"
            tag="v$version"
          fi

          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf 'Refusing invalid release tag: %s\n' "$tag" >&2
            exit 1
          fi

          set +e
          git show-ref --verify --quiet "refs/tags/$tag"
          local_tag_status=$?
          set -e
          if [[ "$local_tag_status" -ne 0 ]]; then
            if [[ "$local_tag_status" -ne 1 ]]; then
              printf 'Local tag lookup failed: %s (status %s)\n' "$tag" "$local_tag_status" >&2
              exit 1
            fi
            if [[ "$GITHUB_EVENT_NAME" != "push" || "$GITHUB_REF_TYPE" != "branch" || -n "${REQUESTED_TAG:-}" ]]; then
              printf 'Requested release tag does not exist locally: %s\n' "$tag" >&2
              exit 1
            fi
            set +e
            remote_missing_output="$(git ls-remote --exit-code \
              "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" \
              "refs/tags/$tag" "refs/tags/$tag^{}")"
            remote_missing_status=$?
            set -e
            if [[ "$remote_missing_status" -eq 0 ]]; then
              printf 'Matching tag exists remotely but not locally; refusing no-op: %s\n' "$tag" >&2
              exit 1
            fi
            if [[ "$remote_missing_status" -ne 2 || -n "$remote_missing_output" ]]; then
              printf 'Authoritative remote tag-absence lookup failed: %s (status %s)\n' \
                "$tag" "$remote_missing_status" >&2
              exit 1
            fi
            printf 'No matching local or remote tag exists yet; release publication is a no-op: %s\n' "$tag"
            {
              printf 'candidate=false\n'
              printf 'tag=%s\n' "$tag"
              printf 'version=%s\n' "${tag#v}"
              printf 'commit=\n'
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! tag_commit="$(git rev-parse "$tag^{commit}")"; then
            printf 'Local tag cannot be peeled to a commit: %s\n' "$tag" >&2
            exit 1
          fi
          if ! remote_line="$(git ls-remote --exit-code "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "refs/tags/$tag^{}")"; then
            printf 'Remote annotated-tag lookup failed: %s\n' "$tag" >&2
            exit 1
          fi
          if [[ "$remote_line" == *$'\n'* ]]; then
            printf 'Remote tag lookup returned multiple peeled refs: %s\n' "$tag" >&2
            exit 1
          fi
          IFS=$'\t' read -r remote_commit remote_ref remote_extra <<< "$remote_line"
          if [[ ! "$remote_commit" =~ ^[0-9a-f]{40}$ || "$remote_ref" != "refs/tags/$tag^{}" || -n "${remote_extra:-}" ]]; then
            printf 'Remote tag is missing, not annotated, or malformed: %s\n' "$tag" >&2
            exit 1
          fi
          if [[ "$remote_commit" != "$tag_commit" ]]; then
            printf 'Local/remote peeled tag mismatch for %s: %s != %s\n' "$tag" "$tag_commit" "$remote_commit" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == "branch" ]] && ! git merge-base --is-ancestor "$tag_commit" "$GITHUB_SHA"; then
            printf 'Tag %s is not an ancestor of the triggering branch commit.\n' "$tag" >&2
            exit 1
          fi

          version="${tag#v}"
          tagged_version="$(git show "$tag:pyproject.toml" | python -I -S -c 'import sys, tomllib; print(tomllib.loads(sys.stdin.read())["project"]["version"])')"
          if [[ "$tagged_version" != "$version" ]]; then
            printf 'Tag/package version mismatch: %s != %s\n' "$tag" "$tagged_version" >&2
            exit 1
          fi

          {
            printf 'candidate=true\n'
            printf 'tag=%s\n' "$tag"
            printf 'version=%s\n' "$version"
            printf 'commit=%s\n' "$tag_commit"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    if: needs.resolve.outputs.candidate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Stage trusted release helper
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(python -I -S -c 'import hashlib, pathlib; print(hashlib.sha256(pathlib.Path(".github/scripts/release_tool.py").read_bytes()).hexdigest())')"
          if [[ "$actual_sha" != "$RELEASE_TOOL_SHA256" ]]; then
            printf 'Release helper checksum mismatch: %s\n' "$actual_sha" >&2
            exit 1
          fi
          cp .github/scripts/release_tool.py "$RUNNER_TEMP/release-tool.py"

      - name: Verify and check out resolved tag
        shell: bash
        env:
          RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          if ! local_commit="$(git rev-parse "$RELEASE_TAG^{commit}")"; then
            printf 'Resolved local tag cannot be peeled to a commit: %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi
          test "$local_commit" = "$RELEASE_COMMIT"
          if ! remote_line="$(git ls-remote --exit-code "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "refs/tags/$RELEASE_TAG^{}")"; then
            printf 'Resolved remote annotated-tag lookup failed: %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi
          IFS=$'\t' read -r remote_commit remote_ref remote_extra <<< "$remote_line"
          if [[ "$remote_line" == *$'\n'* \
            || ! "$remote_commit" =~ ^[0-9a-f]{40}$ \
            || "$remote_ref" != "refs/tags/$RELEASE_TAG^{}" \
            || -n "${remote_extra:-}" \
            || "$remote_commit" != "$RELEASE_COMMIT" ]]
          then
            printf 'Resolved tag is no longer the expected remote annotated tag: %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi
          git checkout --detach "$RELEASE_TAG"
          if ! checked_out_commit="$(git rev-parse HEAD)"; then
            printf 'Checked-out commit lookup failed: %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi
          test "$checked_out_commit" = "$RELEASE_COMMIT"
          tagged_version="$(python -I -S -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          test "$tagged_version" = "$RELEASE_VERSION"
          git show "$RELEASE_COMMIT:CHANGELOG.md" > "$RUNNER_TEMP/tagged-CHANGELOG.md"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk x11-xserver-utils xvfb

      - name: Install release tooling and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m pip install -e ".[dev]"

      - name: Run tagged test suite
        run: xvfb-run -a python -m pytest -q

      - name: Build and check distributions
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          python -m build
          python -m twine check dist/*
          python -I -S - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"]
          expected = {
              f"mint_background_switcher-{version}-py3-none-any.whl",
              f"mint_background_switcher-{version}.tar.gz",
          }
          actual = {path.name for path in Path("dist").iterdir() if path.is_file()}
          if actual != expected:
              raise SystemExit(f"Unexpected distribution set: {sorted(actual)}")
          PY

      - name: Fresh-install wheel and source distribution
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          wheel_venv="$RUNNER_TEMP/wheel-venv"
          sdist_venv="$RUNNER_TEMP/sdist-venv"
          outside_checkout="$RUNNER_TEMP/outside-checkout"
          mkdir -p "$outside_checkout"

          python -m venv "$wheel_venv"
          "$wheel_venv/bin/python" -m pip install --quiet dist/*.whl
          (
            cd "$outside_checkout"
            "$wheel_venv/bin/python" -c 'import os, mint_background_switcher as m; assert m.__version__ == os.environ["RELEASE_VERSION"]'
            "$wheel_venv/bin/mint-background-switcher" --version
            "$wheel_venv/bin/mint-background-switcher" --help >/dev/null
          )

          python -m venv "$sdist_venv"
          "$sdist_venv/bin/python" -m pip install --quiet dist/*.tar.gz
          (
            cd "$outside_checkout"
            "$sdist_venv/bin/python" -c 'import os, mint_background_switcher as m; assert m.__version__ == os.environ["RELEASE_VERSION"]'
            "$sdist_venv/bin/mint-background-switcher" --version
            "$sdist_venv/bin/mint-background-switcher" --help >/dev/null
          )

      - name: Prepare verified release bundle
        shell: bash
        env:
          RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/release-bundle"
          wheel="mint_background_switcher-${RELEASE_VERSION}-py3-none-any.whl"
          sdist="mint_background_switcher-${RELEASE_VERSION}.tar.gz"
          mkdir -p "$bundle/dist"
          cp "dist/$wheel" "dist/$sdist" "$bundle/dist/"
          cp "$RUNNER_TEMP/release-tool.py" "$bundle/release-tool.py"

          python -I -S "$RUNNER_TEMP/release-tool.py" render \
            --dist "$bundle/dist" \
            --changelog "$RUNNER_TEMP/tagged-CHANGELOG.md" \
            --notes "$bundle/release-notes.md" \
            --manifest "$bundle/release-manifest.json" \
            --tag "$RELEASE_TAG" \
            --version "$RELEASE_VERSION" \
            --commit "$RELEASE_COMMIT"
          python -I -S "$RUNNER_TEMP/release-tool.py" validate-bundle \
            --bundle "$bundle" \
            --changelog "$RUNNER_TEMP/tagged-CHANGELOG.md" \
            --tag "$RELEASE_TAG" \
            --version "$RELEASE_VERSION" \
            --commit "$RELEASE_COMMIT"

          actual_sha="$(python -I -S -c 'import hashlib, os, pathlib; print(hashlib.sha256(pathlib.Path(os.environ["RUNNER_TEMP"], "release-tool.py").read_bytes()).hexdigest())')"
          test "$actual_sha" = "$RELEASE_TOOL_SHA256"
          if ! remote_line="$(git ls-remote --exit-code "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "refs/tags/$RELEASE_TAG^{}")"; then
            printf 'Remote annotated-tag lookup failed after build: %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi
          IFS=$'\t' read -r remote_commit remote_ref remote_extra <<< "$remote_line"
          if [[ "$remote_line" == *$'\n'* \
            || ! "$remote_commit" =~ ^[0-9a-f]{40}$ \
            || "$remote_ref" != "refs/tags/$RELEASE_TAG^{}" \
            || -n "${remote_extra:-}" \
            || "$remote_commit" != "$RELEASE_COMMIT" ]]
          then
            printf 'Remote tag changed during the tagged build: %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi

      - name: Upload verified release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-bundle
          path: ${{ runner.temp }}/release-bundle
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    needs:
      - resolve
      - build
    if: needs.resolve.outputs.candidate == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: publish-github-release-${{ needs.resolve.outputs.tag }}
      cancel-in-progress: false
    outputs:
      release_id: ${{ steps.publish.outputs.release_id }}
      tag: ${{ steps.publish.outputs.tag }}

    steps:
      - name: Download verified release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-bundle
          path: ${{ runner.temp }}/release-bundle

      - name: Publish or repair GitHub Release transactionally
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/release-bundle"
          tool="$bundle/release-tool.py"
          changelog="$RUNNER_TEMP/tagged-CHANGELOG.md"
          title="Mint Background Switcher $RELEASE_VERSION"
          wheel="mint_background_switcher-${RELEASE_VERSION}-py3-none-any.whl"
          sdist="mint_background_switcher-${RELEASE_VERSION}.tar.gz"

          python3 -I -S - "$bundle" "$RELEASE_TOOL_SHA256" "$wheel" "$sdist" <<'PY'
          import hashlib
          import sys
          from pathlib import Path

          bundle = Path(sys.argv[1])
          expected_sha = sys.argv[2]
          expected_dist = {sys.argv[3], sys.argv[4]}
          expected_top = {"dist", "release-manifest.json", "release-notes.md", "release-tool.py"}
          if not bundle.is_dir() or bundle.is_symlink():
              raise SystemExit("Downloaded release bundle is not a regular directory")
          if {path.name for path in bundle.iterdir()} != expected_top:
              raise SystemExit("Downloaded release bundle has unexpected top-level entries")
          dist = bundle / "dist"
          if not dist.is_dir() or dist.is_symlink():
              raise SystemExit("Downloaded distribution directory is invalid")
          if {path.name for path in dist.iterdir()} != expected_dist:
              raise SystemExit("Downloaded distribution set is invalid")
          paths = [bundle / "release-manifest.json", bundle / "release-notes.md", bundle / "release-tool.py", *dist.iterdir()]
          for path in paths:
              if not path.is_file() or path.is_symlink():
                  raise SystemExit(f"Downloaded bundle entry is not a regular file: {path.name}")
          actual_sha = hashlib.sha256((bundle / "release-tool.py").read_bytes()).hexdigest()
          if actual_sha != expected_sha:
              raise SystemExit(f"Downloaded release helper checksum mismatch: {actual_sha}")
          PY

          if ! gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/$GITHUB_REPOSITORY/contents/CHANGELOG.md?ref=$RELEASE_COMMIT" > "$changelog"
          then
            printf 'Tagged changelog request failed: %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi
          python3 -I -S "$tool" validate-bundle \
            --bundle "$bundle" \
            --changelog "$changelog" \
            --tag "$RELEASE_TAG" \
            --version "$RELEASE_VERSION" \
            --commit "$RELEASE_COMMIT"

          check_remote() {
            local stage="$1"
            local remote_line remote_commit remote_ref remote_extra
            if ! remote_line="$(git ls-remote --exit-code "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "refs/tags/$RELEASE_TAG^{}")"; then
              printf 'Remote tag lookup failed %s: %s\n' "$stage" "$RELEASE_TAG" >&2
              return 1
            fi
            if [[ "$remote_line" == *$'\n'* ]]; then
              printf 'Remote tag lookup returned multiple refs %s: %s\n' "$stage" "$RELEASE_TAG" >&2
              return 1
            fi
            IFS=$'\t' read -r remote_commit remote_ref remote_extra <<< "$remote_line"
            if [[ ! "$remote_commit" =~ ^[0-9a-f]{40}$ \
              || "$remote_ref" != "refs/tags/$RELEASE_TAG^{}" \
              || -n "${remote_extra:-}" \
              || "$remote_commit" != "$RELEASE_COMMIT" ]]
            then
              printf 'Remote tag identity mismatch %s: %s\n' "$stage" "$RELEASE_TAG" >&2
              return 1
            fi
          }

          query_release_once() {
            local suffix="$1"
            local response="$RUNNER_TEMP/release-graphql-$suffix.json"
            local owner="${GITHUB_REPOSITORY%%/*}"
            local repository="${GITHUB_REPOSITORY#*/}"
            local release_id status
            if ! gh api graphql \
              -f query='query($owner:String!,$repository:String!,$tag:String!){repository(owner:$owner,name:$repository){release(tagName:$tag){databaseId isDraft isPrerelease tagName}}}' \
              -F owner="$owner" -F repository="$repository" -F tag="$RELEASE_TAG" > "$response"
            then
              printf 'Direct GraphQL Release lookup failed: %s (%s)\n' "$RELEASE_TAG" "$suffix" >&2
              return 1
            fi
            set +e
            release_id="$(python3 -I -S "$tool" graphql-release-id --response "$response" --tag "$RELEASE_TAG")"
            status=$?
            set -e
            if [[ "$status" -eq 0 ]]; then
              RELEASE_EXISTS=true
              RELEASE_ID="$release_id"
              return 0
            fi
            if [[ "$status" -eq 11 ]]; then
              RELEASE_EXISTS=false
              RELEASE_ID=""
              return 0
            fi
            return "$status"
          }

          find_release_with_backoff() {
            local suffix="$1"
            local attempt
            for attempt in 1 2 3; do
              query_release_once "$suffix-$attempt"
              if [[ "$RELEASE_EXISTS" == "true" ]]; then
                return 0
              fi
              if [[ "$attempt" -lt 3 ]]; then
                sleep "$attempt"
              fi
            done
          }

          fetch_release_by_id() {
            local release_id="$1"
            local suffix="$2"
            RELEASE_JSON="$RUNNER_TEMP/release-id-$release_id-$suffix.json"
            if ! gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$RELEASE_JSON"; then
              printf 'Release-by-ID request failed: %s (%s)\n' "$release_id" "$suffix" >&2
              return 1
            fi
          }

          fetch_release() {
            local suffix="$1"
            find_release_with_backoff "$suffix"
            if [[ "$RELEASE_EXISTS" == "true" ]]; then
              fetch_release_by_id "$RELEASE_ID" "$suffix"
            else
              RELEASE_JSON="$RUNNER_TEMP/release-missing-$suffix.json"
            fi
          }

          download_release() {
            local release_json="$1"
            local destination="$2"
            local rows
            local asset_id asset_name
            rows="$RUNNER_TEMP/release-downloads-$(basename "$destination").txt"
            if ! mkdir -p "$destination"; then
              printf 'Release asset destination creation failed: %s\n' "$destination" >&2
              return 1
            fi
            if ! python3 -I -S "$tool" asset-downloads \
              --release "$release_json" --version "$RELEASE_VERSION" > "$rows"
            then
              printf 'Release asset row validation failed: %s\n' "$RELEASE_TAG" >&2
              return 1
            fi
            while IFS=$'\t' read -r asset_id asset_name; do
              if [[ ! "$asset_id" =~ ^[1-9][0-9]*$ \
                || ( "$asset_name" != "$wheel" && "$asset_name" != "$sdist" ) ]]
              then
                printf 'Invalid ID-bound asset download row: %s %s\n' "$asset_id" "$asset_name" >&2
                return 1
              fi
              if ! gh api -H 'Accept: application/octet-stream' \
                "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" > "$destination/$asset_name"
              then
                printf 'Release asset download by ID failed: %s (%s)\n' "$asset_id" "$RELEASE_TAG" >&2
                return 1
              fi
            done < "$rows"
          }

          upload_asset_by_id() {
            local release_json="$1"
            local release_id="$2"
            local asset_path="$3"
            local output="$4"
            local upload_url asset_name expected_size
            asset_name="$(basename "$asset_path")"
            if [[ "$asset_name" != "$wheel" && "$asset_name" != "$sdist" ]]; then
              printf 'Refusing unexpected release asset upload: %s\n' "$asset_name" >&2
              return 1
            fi
            if ! upload_url="$(python3 -I -S "$tool" release-upload-url \
              --release "$release_json" --repository "$GITHUB_REPOSITORY" \
              --id "$release_id" --server-url "$GITHUB_SERVER_URL")"
            then
              printf 'Release upload URL validation failed: %s\n' "$RELEASE_TAG" >&2
              return 1
            fi
            if ! gh api --method POST -H 'Content-Type: application/octet-stream' \
              "$upload_url?name=$asset_name" --input "$asset_path" > "$output"
            then
              printf 'ID-bound Release asset upload failed: %s\n' "$asset_name" >&2
              return 1
            fi
            if ! expected_size="$(python3 -I -S -c \
              'import pathlib,sys; print(pathlib.Path(sys.argv[1]).stat().st_size)' "$asset_path")"
            then
              printf 'Uploaded asset size lookup failed: %s\n' "$asset_name" >&2
              return 1
            fi
            if [[ ! "$expected_size" =~ ^[1-9][0-9]*$ ]]; then
              printf 'Uploaded asset size is invalid: %s\n' "$asset_name" >&2
              return 1
            fi
            if ! python3 -I -S "$tool" validate-upload-response \
              --response "$output" --name "$asset_name" --size "$expected_size"
            then
              printf 'Release asset upload response validation failed: %s\n' "$asset_name" >&2
              return 1
            fi
          }

          preflight_upload_url() {
            local release_json="$1"
            local release_id="$2"
            if ! python3 -I -S "$tool" release-upload-url \
              --release "$release_json" --repository "$GITHUB_REPOSITORY" \
              --id "$release_id" --server-url "$GITHUB_SERVER_URL" > /dev/null
            then
              printf 'Release upload target preflight failed: %s\n' "$RELEASE_TAG" >&2
              return 1
            fi
          }

          check_workflow_scope() {
            local stage="$1"
            local remote="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
            local info default_ref default_commit line first second extra
            local resolved_default resolved_tag
            local scope="$RUNNER_TEMP/workflow-scope-${stage//[^A-Za-z0-9]/-}.git"
            local default_tree="$RUNNER_TEMP/workflow-default-${stage//[^A-Za-z0-9]/-}.tree"
            local target_tree="$RUNNER_TEMP/workflow-target-${stage//[^A-Za-z0-9]/-}.tree"
            if ! info="$(git ls-remote --symref "$remote" HEAD)"; then
              printf 'Default-branch lookup failed before %s.\n' "$stage" >&2
              return 1
            fi
            if [[ "$info" == *$'\n'*$'\n'* ]]; then
              printf 'Default-branch lookup returned unexpected records before %s.\n' "$stage" >&2
              return 1
            fi
            first="${info%%$'\n'*}"
            second="${info#*$'\n'}"
            if [[ "$first" == "$second" ]]; then
              printf 'Default-branch lookup was incomplete before %s.\n' "$stage" >&2
              return 1
            fi
            if [[ "$first" != ref:\ refs/heads/*$'\t'HEAD ]]; then
              printf 'Default-branch symbolic ref was malformed before %s.\n' "$stage" >&2
              return 1
            fi
            default_ref="${first#ref: }"
            default_ref="${default_ref%$'\t'HEAD}"
            IFS=$'\t' read -r default_commit line extra <<< "$second"
            if [[ ! "$default_ref" =~ ^refs/heads/[^[:space:]]+$ \
              || ! "$default_commit" =~ ^[0-9a-f]{40}$ \
              || "$line" != "HEAD" || -n "${extra:-}" ]]
            then
              printf 'Default-branch identity was malformed before %s.\n' "$stage" >&2
              return 1
            fi
            rm -rf "$scope"
            if ! git init --quiet --bare "$scope"; then
              printf 'Workflow-scope repository initialization failed before %s.\n' "$stage" >&2
              return 1
            fi
            if ! git -C "$scope" fetch --quiet --no-tags "$remote" \
              "+$default_ref:refs/check/default"
            then
              printf 'Default-branch fetch failed before %s.\n' "$stage" >&2
              return 1
            fi
            if ! git -C "$scope" fetch --quiet --no-tags "$remote" \
              "+refs/tags/$RELEASE_TAG:refs/check/tag"
            then
              printf 'Release-tag fetch failed before %s.\n' "$stage" >&2
              return 1
            fi
            if ! resolved_default="$(git -C "$scope" rev-parse 'refs/check/default^{commit}')"; then
              printf 'Default commit resolution failed before %s.\n' "$stage" >&2
              return 1
            fi
            if ! resolved_tag="$(git -C "$scope" rev-parse 'refs/check/tag^{commit}')"; then
              printf 'Tag commit resolution failed before %s.\n' "$stage" >&2
              return 1
            fi
            if [[ ! "$resolved_default" =~ ^[0-9a-f]{40}$ \
              || ! "$resolved_tag" =~ ^[0-9a-f]{40}$ \
              || "$resolved_default" != "$default_commit" \
              || "$resolved_tag" != "$RELEASE_COMMIT" ]]
            then
              printf 'Workflow-scope Git fetch identity mismatch before %s.\n' "$stage" >&2
              return 1
            fi
            if ! git -C "$scope" ls-tree -rz --full-tree refs/check/default -- .github/workflows > "$default_tree"; then
              printf 'Default workflow-tree read failed before %s.\n' "$stage" >&2
              return 1
            fi
            if ! git -C "$scope" ls-tree -rz --full-tree refs/check/tag -- .github/workflows > "$target_tree"; then
              printf 'Target workflow-tree read failed before %s.\n' "$stage" >&2
              return 1
            fi
            python3 -I -S - "$default_tree" "$target_tree" "$stage" <<'PY'
          import re
          import sys
          from pathlib import Path

          def tree(path):
              result = {}
              for record in Path(path).read_bytes().split(b"\0"):
                  if not record:
                      continue
                  try:
                      metadata, name = record.split(b"\t", 1)
                      mode, kind, object_id = metadata.split(b" ")
                  except ValueError as error:
                      raise SystemExit(f"Malformed Git tree record: {error}")
                  if kind != b"blob" or re.fullmatch(rb"[0-9a-f]{40}", object_id) is None:
                      raise SystemExit("Malformed workflow-tree object")
                  if not name.startswith(b".github/workflows/") or name in result:
                      raise SystemExit("Malformed or duplicate workflow-tree path")
                  result[name] = (mode, object_id)
              return result

          default = tree(sys.argv[1])
          target = tree(sys.argv[2])
          blocked = [name for name, identity in target.items() if default.get(name) != identity]
          if blocked:
              rendered = ", ".join(name.decode("utf-8", "backslashreplace") for name in sorted(blocked))
              raise SystemExit(
                  f"Built-in GITHUB_TOKEN lacks Workflows write permission for target additions/modifications "
                  f"before {sys.argv[3]}: {rendered}"
              )
          PY
          }

          validate_release() {
            local release_json="$1"
            local state="$2"
            local downloads="${3:-}"
            local args=(
              validate-release
              --release "$release_json"
              --bundle "$bundle"
              --changelog "$changelog"
              --tag "$RELEASE_TAG"
              --version "$RELEASE_VERSION"
              --commit "$RELEASE_COMMIT"
              --state "$state"
            )
            if [[ -n "$downloads" ]]; then
              args+=(--downloads "$downloads")
            fi
            python3 -I -S "$tool" "${args[@]}"
          }

          validate_existing() {
            local release_json="$1"
            local downloads="${2:-}"
            local args=(
              validate-existing
              --release "$release_json"
              --changelog "$changelog"
              --tag "$RELEASE_TAG"
              --version "$RELEASE_VERSION"
              --commit "$RELEASE_COMMIT"
            )
            if [[ -n "$downloads" ]]; then
              args+=(--downloads "$downloads")
            fi
            python3 -I -S "$tool" "${args[@]}"
          }

          validate_record() {
            local release_json="$1"
            local state="$2"
            local release_id="$3"
            python3 -I -S "$tool" validate-record \
              --release "$release_json" --tag "$RELEASE_TAG" \
              --state "$state" --id "$release_id"
          }

          check_remote 'before Release state validation'
          fetch_release initial
          release_exists="$RELEASE_EXISTS"
          release_json="$RELEASE_JSON"
          initial_state=""
          if [[ "$release_exists" == "true" ]]; then
            initial_state="$(python3 -I -S "$tool" release-state --release "$release_json")"
          fi
          needs_repair=false

          if [[ "$release_exists" == "false" ]]; then
            needs_repair=true
          elif validate_existing "$release_json"; then
            first_download="$RUNNER_TEMP/existing-release-assets-first"
            download_release "$release_json" "$first_download"
            if validate_existing "$release_json" "$first_download"; then
              check_remote 'after complete Release download validation'
            else
              status=$?
              if [[ "$status" -ne 10 ]]; then
                exit "$status"
              fi
              second_download="$RUNNER_TEMP/existing-release-assets-second"
              download_release "$release_json" "$second_download"
              if validate_existing "$release_json" "$second_download"; then
                check_remote 'after repeated complete Release download validation'
              else
                status=$?
                if [[ "$status" -eq 10 ]]; then
                  needs_repair=true
                else
                  exit "$status"
                fi
              fi
            fi
          else
            status=$?
            if [[ "$status" -eq 10 ]]; then
              needs_repair=true
            else
              exit "$status"
            fi
          fi

          performed_repair=false
          if [[ "$needs_repair" == "true" ]]; then
            check_remote 'before draft transaction'
            check_workflow_scope 'draft transaction'
            if [[ "$release_exists" == "true" ]]; then
              release_id="$(python3 -I -S "$tool" release-id --release "$release_json")"
              fetch_release_by_id "$release_id" before-mutation
              fresh_json="$RELEASE_JSON"
              current_state="$(python3 -I -S "$tool" release-state --release "$fresh_json")"
              python3 -I -S "$tool" validate-repair-record \
                --release "$fresh_json" --tag "$RELEASE_TAG" \
                --state "$current_state" --id "$release_id"
              preflight_upload_url "$fresh_json" "$release_id"
              if [[ "$current_state" != "$initial_state" ]]; then
                printf 'Release state changed during repair preflight; retry: %s\n' "$RELEASE_TAG" >&2
                exit 1
              fi

              if [[ "$current_state" == "final" ]]; then
                if validate_existing "$fresh_json"; then
                  fresh_download="$RUNNER_TEMP/fresh-existing-release-assets-first"
                  download_release "$fresh_json" "$fresh_download"
                  if validate_existing "$fresh_json" "$fresh_download"; then
                    check_remote 'after fresh complete Release validation'
                    needs_repair=false
                    release_json="$fresh_json"
                  else
                    status=$?
                    if [[ "$status" -ne 10 ]]; then
                      exit "$status"
                    fi
                    repeated_fresh_download="$RUNNER_TEMP/fresh-existing-release-assets-second"
                    download_release "$fresh_json" "$repeated_fresh_download"
                    if validate_existing "$fresh_json" "$repeated_fresh_download"; then
                      check_remote 'after repeated fresh complete Release validation'
                      needs_repair=false
                      release_json="$fresh_json"
                    else
                      status=$?
                      [[ "$status" -eq 10 ]] || exit "$status"
                    fi
                  fi
                else
                  status=$?
                  [[ "$status" -eq 10 ]] || exit "$status"
                fi

                if [[ "$needs_repair" == "true" ]]; then
                  if ! immutable="$(python3 -I -S "$tool" release-immutable --release "$fresh_json")"; then
                    printf 'Release immutable-state parsing failed: %s\n' "$RELEASE_TAG" >&2
                    exit 1
                  fi
                  if [[ "$immutable" == "true" ]]; then
                    printf 'Immutable Release cannot be repaired under the same tag: %s\n' "$RELEASE_TAG" >&2
                    exit 1
                  fi
                  transition_json="$RUNNER_TEMP/release-draft-transition.json"
                  if ! gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
                    -F draft=true -F prerelease=false -f make_latest=false > "$transition_json"
                  then
                    printf 'Failed to move Release to a non-Latest draft: %s\n' "$RELEASE_TAG" >&2
                    exit 1
                  fi
                  validate_record "$transition_json" draft "$release_id"
                  fetch_release_by_id "$release_id" after-draft-transition
                  draft_json="$RELEASE_JSON"
                  validate_record "$draft_json" draft "$release_id"
                fi
              else
                if ! immutable="$(python3 -I -S "$tool" release-immutable --release "$fresh_json")"; then
                  printf 'Draft Release immutable-state parsing failed: %s\n' "$RELEASE_TAG" >&2
                  exit 1
                fi
                if [[ "$immutable" == "true" ]]; then
                  printf 'Immutable draft Release cannot be repaired: %s\n' "$RELEASE_TAG" >&2
                  exit 1
                fi
                draft_json="$fresh_json"
              fi
            else
              fetch_release before-create
              if [[ "$RELEASE_EXISTS" == "true" ]]; then
                printf 'Release appeared during creation preflight; retry from fresh state: %s\n' "$RELEASE_TAG" >&2
                exit 1
              fi
              create_request="$RUNNER_TEMP/release-create-request.json"
              create_response="$RUNNER_TEMP/release-create-response.json"
              python3 -I -S - "$RELEASE_TAG" "$title" "$bundle/release-notes.md" "$create_request" <<'PY'
          import json
          import sys
          from pathlib import Path

          tag, title, notes_path, output_path = sys.argv[1:]
          request = {
              "tag_name": tag,
              "name": title,
              "body": Path(notes_path).read_text(encoding="utf-8"),
              "draft": True,
              "prerelease": False,
              "make_latest": "false",
          }
          Path(output_path).write_text(json.dumps(request, separators=(",", ":")), encoding="utf-8")
          PY
              set +e
              gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
                --input "$create_request" > "$create_response"
              create_status=$?
              set -e
              created_response_valid=false
              if [[ "$create_status" -eq 0 ]]; then
                set +e
                release_id="$(python3 -I -S "$tool" release-id --release "$create_response")"
                parse_status=$?
                set -e
                if [[ "$parse_status" -eq 0 ]] \
                  && validate_record "$create_response" draft "$release_id"
                then
                  created_response_valid=true
                fi
              fi
              if [[ "$created_response_valid" != "true" ]]; then
                printf 'Draft creation response was ambiguous; reconciling without another create: %s\n' "$RELEASE_TAG" >&2
                find_release_with_backoff after-ambiguous-create
                if [[ "$RELEASE_EXISTS" != "true" ]]; then
                  printf 'Draft creation could not be reconciled; refusing another create: %s\n' "$RELEASE_TAG" >&2
                  exit 1
                fi
                release_id="$RELEASE_ID"
              fi
              fetch_release_by_id "$release_id" after-create-by-id
              draft_json="$RELEASE_JSON"
              validate_record "$draft_json" draft "$release_id"
              preflight_upload_url "$draft_json" "$release_id"
            fi

            if [[ "$needs_repair" == "true" ]]; then
              normalized_request="$RUNNER_TEMP/release-normalize-request.json"
              python3 -I -S - "$title" "$bundle/release-notes.md" "$normalized_request" <<'PY'
          import json
          import sys
          from pathlib import Path

          title, notes_path, output_path = sys.argv[1:]
          request = {
              "name": title,
              "body": Path(notes_path).read_text(encoding="utf-8"),
              "draft": True,
              "prerelease": False,
              "make_latest": "false",
          }
          Path(output_path).write_text(json.dumps(request, separators=(",", ":")), encoding="utf-8")
          PY
              normalized_json="$RUNNER_TEMP/release-normalized-draft.json"
              if ! gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
                --input "$normalized_request" > "$normalized_json"
              then
                printf 'Failed to normalize draft Release metadata: %s\n' "$RELEASE_TAG" >&2
                exit 1
              fi
              validate_record "$normalized_json" draft "$release_id"
              fetch_release_by_id "$release_id" draft-before-assets
              draft_json="$RELEASE_JSON"
              validate_record "$draft_json" draft "$release_id"
              preflight_upload_url "$draft_json" "$release_id"

              python3 -I -S "$tool" asset-ids --release "$draft_json" > "$RUNNER_TEMP/release-asset-ids.txt"
              while IFS= read -r asset_id; do
                if ! gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"; then
                  printf 'Failed to delete draft Release asset ID %s: %s\n' "$asset_id" "$RELEASE_TAG" >&2
                  exit 1
                fi
              done < "$RUNNER_TEMP/release-asset-ids.txt"

              fetch_release_by_id "$release_id" draft-after-delete
              validate_record "$RELEASE_JSON" draft "$release_id"
              python3 -I -S "$tool" asset-ids --release "$RELEASE_JSON" > "$RUNNER_TEMP/remaining-release-asset-ids.txt"
              if [[ -s "$RUNNER_TEMP/remaining-release-asset-ids.txt" ]]; then
                printf 'Release assets remain after draft cleanup: %s\n' "$RELEASE_TAG" >&2
                exit 1
              fi

              upload_asset_by_id "$RELEASE_JSON" "$release_id" \
                "$bundle/dist/$wheel" "$RUNNER_TEMP/uploaded-wheel.json"
              fetch_release_by_id "$release_id" draft-after-wheel-upload
              validate_record "$RELEASE_JSON" draft "$release_id"
              upload_asset_by_id "$RELEASE_JSON" "$release_id" \
                "$bundle/dist/$sdist" "$RUNNER_TEMP/uploaded-sdist.json"

              fetch_release_by_id "$release_id" draft-after-assets
              draft_json="$RELEASE_JSON"
              validate_record "$draft_json" draft "$release_id"
              if validate_release "$draft_json" draft; then
                :
              else
                exit $?
              fi
              draft_download="$RUNNER_TEMP/draft-release-assets"
              download_release "$draft_json" "$draft_download"
              if validate_release "$draft_json" draft "$draft_download"; then
                :
              else
                exit $?
              fi
              check_remote 'before finalizing verified draft'

              finalized_json="$RUNNER_TEMP/release-finalization.json"
              if ! gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
                -F draft=false -F prerelease=false -f make_latest=false > "$finalized_json"
              then
                printf 'Failed to publish verified draft Release: %s\n' "$RELEASE_TAG" >&2
                exit 1
              fi
              validate_record "$finalized_json" final "$release_id"
              performed_repair=true
            fi
          fi

          if [[ -z "${release_id:-}" ]]; then
            release_id="$(python3 -I -S "$tool" release-id --release "$release_json")"
          fi
          fetch_release_by_id "$release_id" final
          final_json="$RELEASE_JSON"
          validate_record "$final_json" final "$release_id"
          if [[ "$performed_repair" == "true" ]]; then
            if validate_release "$final_json" final; then
              :
            else
              exit $?
            fi
          else
            if validate_existing "$final_json"; then
              :
            else
              exit $?
            fi
          fi
          final_download="$RUNNER_TEMP/final-release-assets"
          download_release "$final_json" "$final_download"
          if [[ "$performed_repair" == "true" ]]; then
            if validate_release "$final_json" final "$final_download"; then
              :
            else
              exit $?
            fi
          else
            if validate_existing "$final_json" "$final_download"; then
              :
            else
              exit $?
            fi
          fi
          check_remote 'after final Release readback'
          {
            printf 'release_id=%s\n' "$release_id"
            printf 'tag=%s\n' "$RELEASE_TAG"
          } >> "$GITHUB_OUTPUT"
          printf 'Verified final Release: %s (ID %s)\n' "$RELEASE_TAG" "$release_id"

  reconcile_latest:
    needs:
      - resolve
      - build
      - publish
    if: ${{ always() && needs.resolve.outputs.candidate == 'true' && needs.build.result == 'success' && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: publish-github-release-latest
      cancel-in-progress: false

    steps:
      - name: Download verified release helper
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-bundle
          path: ${{ runner.temp }}/release-bundle

      - name: Reconcile Latest release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED_RELEASE_ID: ${{ needs.publish.outputs.release_id }}
          PUBLISHED_RELEASE_TAG: ${{ needs.publish.outputs.tag }}
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/release-bundle/release-tool.py"
          python3 -I -S - "$RUNNER_TEMP/release-bundle" "$RELEASE_TOOL_SHA256" <<'PY'
          import hashlib
          import sys
          from pathlib import Path

          bundle = Path(sys.argv[1])
          expected_sha = sys.argv[2]
          expected_top = {"dist", "release-manifest.json", "release-notes.md", "release-tool.py"}
          if not bundle.is_dir() or bundle.is_symlink():
              raise SystemExit("Downloaded release bundle is not a regular directory")
          if {path.name for path in bundle.iterdir()} != expected_top:
              raise SystemExit("Downloaded release bundle has unexpected top-level entries")
          for path in bundle.rglob("*"):
              if path.is_symlink():
                  raise SystemExit(f"Downloaded release bundle contains a symlink: {path.name}")
          tool = bundle / "release-tool.py"
          if not tool.is_file():
              raise SystemExit("Downloaded release helper is not a regular file")
          actual_sha = hashlib.sha256(tool.read_bytes()).hexdigest()
          if actual_sha != expected_sha:
              raise SystemExit(f"Downloaded release helper checksum mismatch: {actual_sha}")
          PY

          exact_remote_tag() {
            local tag="$1"
            local expected_commit="$2"
            local line current_commit current_ref current_extra
            if ! line="$(git ls-remote --exit-code "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "refs/tags/$tag^{}")"; then
              return 1
            fi
            [[ "$line" != *$'\n'* ]] || return 1
            IFS=$'\t' read -r current_commit current_ref current_extra <<< "$line"
            [[ "$current_commit" =~ ^[0-9a-f]{40}$ \
              && "$current_ref" == "refs/tags/$tag^{}" \
              && -z "${current_extra:-}" \
              && "$current_commit" == "$expected_commit" ]]
          }

          remote_commit_for_tag() {
            local tag="$1"
            local line commit ref extra
            if ! line="$(git ls-remote --exit-code "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "refs/tags/$tag^{}")"; then
              return 1
            fi
            [[ "$line" != *$'\n'* ]] || return 1
            IFS=$'\t' read -r commit ref extra <<< "$line"
            if [[ ! "$commit" =~ ^[0-9a-f]{40}$ \
              || "$ref" != "refs/tags/$tag^{}" || -n "${extra:-}" ]]
            then
              return 1
            fi
            printf '%s\n' "$commit"
          }

          query_release_once() {
            local tag="$1"
            local suffix="$2"
            local response="$RUNNER_TEMP/latest-graphql-$suffix.json"
            local owner="${GITHUB_REPOSITORY%%/*}"
            local repository="${GITHUB_REPOSITORY#*/}"
            local release_id status
            if ! gh api graphql \
              -f query='query($owner:String!,$repository:String!,$tag:String!){repository(owner:$owner,name:$repository){release(tagName:$tag){databaseId isDraft isPrerelease tagName}}}' \
              -F owner="$owner" -F repository="$repository" -F tag="$tag" > "$response"
            then
              printf 'Direct GraphQL Release lookup failed: %s (%s)\n' "$tag" "$suffix" >&2
              return 1
            fi
            set +e
            release_id="$(python3 -I -S "$tool" graphql-release-id --response "$response" --tag "$tag")"
            status=$?
            set -e
            if [[ "$status" -eq 0 ]]; then
              CANDIDATE_EXISTS=true
              CANDIDATE_ID="$release_id"
              return 0
            fi
            if [[ "$status" -eq 11 ]]; then
              CANDIDATE_EXISTS=false
              CANDIDATE_ID=""
              return 0
            fi
            return "$status"
          }

          find_release_with_backoff() {
            local tag="$1"
            local suffix="$2"
            local attempt
            for attempt in 1 2 3; do
              if ! query_release_once "$tag" "$suffix-$attempt"; then
                return 1
              fi
              if [[ "$CANDIDATE_EXISTS" == "true" ]]; then
                return 0
              fi
              if [[ "$attempt" -lt 3 ]]; then
                sleep "$attempt"
              fi
            done
          }

          fetch_release_by_id() {
            local release_id="$1"
            local suffix="$2"
            CANDIDATE_JSON="$RUNNER_TEMP/latest-release-$release_id-$suffix.json"
            if ! gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$CANDIDATE_JSON"; then
              printf 'Release-by-ID request failed: %s (%s)\n' "$release_id" "$suffix" >&2
              return 1
            fi
          }

          download_release_by_id() {
            local release_json="$1"
            local version="$2"
            local destination="$3"
            local suffix="$4"
            local rows="$RUNNER_TEMP/latest-downloads-$suffix.txt"
            local asset_id asset_name wheel sdist
            wheel="mint_background_switcher-${version}-py3-none-any.whl"
            sdist="mint_background_switcher-${version}.tar.gz"
            if ! mkdir -p "$destination"; then
              printf 'Latest asset destination creation failed: %s\n' "$destination" >&2
              return 1
            fi
            if ! python3 -I -S "$tool" asset-downloads \
              --release "$release_json" --version "$version" > "$rows"
            then
              printf 'Latest asset row validation failed: %s\n' "$suffix" >&2
              return 1
            fi
            while IFS=$'\t' read -r asset_id asset_name; do
              if [[ ! "$asset_id" =~ ^[1-9][0-9]*$ \
                || ( "$asset_name" != "$wheel" && "$asset_name" != "$sdist" ) ]]
              then
                printf 'Invalid ID-bound Latest asset row: %s %s\n' "$asset_id" "$asset_name" >&2
                return 1
              fi
              if ! gh api -H 'Accept: application/octet-stream' \
                "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" > "$destination/$asset_name"
              then
                printf 'Latest candidate asset download by ID failed: %s\n' "$asset_id" >&2
                return 1
              fi
            done < "$rows"
          }

          validate_candidate() {
            local tag="$1"
            local commit="$2"
            local release_id="$3"
            local suffix="$4"
            local version="${tag#v}"
            local changelog="$RUNNER_TEMP/latest-changelog-$suffix.md"
            local downloads="$RUNNER_TEMP/latest-assets-$suffix"
            local status
            exact_remote_tag "$tag" "$commit" || return 1
            fetch_release_by_id "$release_id" "$suffix" \
              || { status=$?; return "$status"; }
            python3 -I -S "$tool" validate-record \
              --release "$CANDIDATE_JSON" --tag "$tag" --state final --id "$release_id" \
              || { status=$?; return "$status"; }
            python3 -I -S "$tool" validate-latest \
              --release "$CANDIDATE_JSON" --tag "$tag" --commit "$commit" \
              || { status=$?; return "$status"; }
            if ! gh api -H 'Accept: application/vnd.github.raw+json' \
              "repos/$GITHUB_REPOSITORY/contents/CHANGELOG.md?ref=$commit" > "$changelog"
            then
              printf 'Latest candidate changelog request failed: %s\n' "$tag" >&2
              return 1
            fi
            download_release_by_id "$CANDIDATE_JSON" "$version" "$downloads" "$suffix" \
              || { status=$?; return "$status"; }
            python3 -I -S "$tool" validate-existing \
              --release "$CANDIDATE_JSON" --changelog "$changelog" \
              --tag "$tag" --version "$version" --commit "$commit" \
              --downloads "$downloads" \
              || { status=$?; return "$status"; }
            exact_remote_tag "$tag" "$commit"
          }

          check_workflow_scope() {
            local tag="$1"
            local commit="$2"
            local stage="$3"
            local remote="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
            local info default_ref default_commit line first second extra
            local resolved_default resolved_tag
            local scope="$RUNNER_TEMP/latest-workflow-scope-${stage//[^A-Za-z0-9]/-}.git"
            local default_tree="$RUNNER_TEMP/latest-workflow-default-${stage//[^A-Za-z0-9]/-}.tree"
            local target_tree="$RUNNER_TEMP/latest-workflow-target-${stage//[^A-Za-z0-9]/-}.tree"
            if ! info="$(git ls-remote --symref "$remote" HEAD)"; then
              printf 'Default-branch lookup failed before %s.\n' "$stage" >&2
              return 1
            fi
            [[ "$info" != *$'\n'*$'\n'* ]] || return 1
            first="${info%%$'\n'*}"
            second="${info#*$'\n'}"
            [[ "$first" != "$second" && "$first" == ref:\ refs/heads/*$'\t'HEAD ]] || return 1
            default_ref="${first#ref: }"
            default_ref="${default_ref%$'\t'HEAD}"
            IFS=$'\t' read -r default_commit line extra <<< "$second"
            if [[ ! "$default_ref" =~ ^refs/heads/[^[:space:]]+$ \
              || ! "$default_commit" =~ ^[0-9a-f]{40}$ \
              || "$line" != "HEAD" || -n "${extra:-}" ]]
            then
              return 1
            fi
            rm -rf "$scope"
            if ! git init --quiet --bare "$scope"; then
              return 1
            fi
            if ! git -C "$scope" fetch --quiet --no-tags "$remote" \
              "+$default_ref:refs/check/default"
            then
              return 1
            fi
            if ! git -C "$scope" fetch --quiet --no-tags "$remote" \
              "+refs/tags/$tag:refs/check/tag"
            then
              return 1
            fi
            if ! resolved_default="$(git -C "$scope" rev-parse 'refs/check/default^{commit}')"; then
              return 1
            fi
            if ! resolved_tag="$(git -C "$scope" rev-parse 'refs/check/tag^{commit}')"; then
              return 1
            fi
            if [[ ! "$resolved_default" =~ ^[0-9a-f]{40}$ \
              || ! "$resolved_tag" =~ ^[0-9a-f]{40}$ \
              || "$resolved_default" != "$default_commit" \
              || "$resolved_tag" != "$commit" ]]
            then
              return 1
            fi
            if ! git -C "$scope" ls-tree -rz --full-tree refs/check/default -- .github/workflows > "$default_tree"; then
              printf 'Default workflow-tree read failed before %s.\n' "$stage" >&2
              return 1
            fi
            if ! git -C "$scope" ls-tree -rz --full-tree refs/check/tag -- .github/workflows > "$target_tree"; then
              printf 'Target workflow-tree read failed before %s.\n' "$stage" >&2
              return 1
            fi
            python3 -I -S - "$default_tree" "$target_tree" "$stage" <<'PY'
          import re
          import sys
          from pathlib import Path

          def tree(path):
              result = {}
              for record in Path(path).read_bytes().split(b"\0"):
                  if not record:
                      continue
                  metadata, name = record.split(b"\t", 1)
                  mode, kind, object_id = metadata.split(b" ")
                  if kind != b"blob" or re.fullmatch(rb"[0-9a-f]{40}", object_id) is None:
                      raise SystemExit("Malformed workflow-tree object")
                  if not name.startswith(b".github/workflows/") or name in result:
                      raise SystemExit("Malformed or duplicate workflow-tree path")
                  result[name] = (mode, object_id)
              return result

          default = tree(sys.argv[1])
          target = tree(sys.argv[2])
          blocked = [name for name, identity in target.items() if default.get(name) != identity]
          if blocked:
              rendered = ", ".join(name.decode("utf-8", "backslashreplace") for name in sorted(blocked))
              raise SystemExit(
                  f"Built-in GITHUB_TOKEN lacks Workflows write permission for target additions/modifications "
                  f"before {sys.argv[3]}: {rendered}"
              )
          PY
          }

          verify_required_release() {
            local suffix="$1"
            local commit status
            if ! commit="$(remote_commit_for_tag "$PUBLISHED_RELEASE_TAG")"; then
              printf 'Published Release tag is no longer a valid remote annotated tag.\n' >&2
              return 1
            fi
            if ! find_release_with_backoff "$PUBLISHED_RELEASE_TAG" "required-$suffix"; then
              return 1
            fi
            if [[ "$CANDIDATE_EXISTS" != "true" || "$CANDIDATE_ID" != "$PUBLISHED_RELEASE_ID" ]]; then
              printf 'Published Release identity is absent or changed during Latest reconciliation.\n' >&2
              return 1
            fi
            set +e
            validate_candidate "$PUBLISHED_RELEASE_TAG" "$commit" "$PUBLISHED_RELEASE_ID" "required-$suffix"
            status=$?
            set -e
            if [[ "$status" -ne 0 ]]; then
              printf 'Published Release failed complete-state verification during Latest reconciliation.\n' >&2
              return "$status"
            fi
          }

          select_latest() {
            local suffix="$1"
            local remote_tags="$RUNNER_TEMP/remote-release-tags-$suffix.txt"
            local candidates="$RUNNER_TEMP/remote-release-candidates-$suffix.txt"
            local tag commit status
            if ! git ls-remote --tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" \
              'refs/tags/v*^{}' > "$remote_tags"
            then
              printf 'Remote release-tag inventory failed: %s\n' "$suffix" >&2
              return 1
            fi
            if ! python3 -I -S "$tool" remote-candidates \
              --remote-tags "$remote_tags" > "$candidates"
            then
              printf 'Remote release-tag parsing failed: %s\n' "$suffix" >&2
              return 1
            fi
            while IFS=$'\t' read -r tag commit; do
              [[ -n "$tag" && -n "$commit" ]] || continue
              exact_remote_tag "$tag" "$commit" || return 1
              if ! find_release_with_backoff "$tag" "candidate-$suffix-${tag}"; then
                return 1
              fi
              if [[ "$CANDIDATE_EXISTS" != "true" ]]; then
                continue
              fi
              set +e
              validate_candidate "$tag" "$commit" "$CANDIDATE_ID" "candidate-$suffix-${tag}"
              status=$?
              set -e
              if [[ "$status" -eq 0 ]]; then
                SELECTED_TAG="$tag"
                SELECTED_COMMIT="$commit"
                SELECTED_ID="$CANDIDATE_ID"
                return 0
              fi
              if [[ "$status" -ne 10 ]]; then
                return "$status"
              fi
            done < "$candidates"
            printf 'No complete final Release has a current remotely peeled strict version tag.\n' >&2
            return 1
          }

          if [[ ! "$PUBLISHED_RELEASE_ID" =~ ^[1-9][0-9]*$ \
            || ! "$PUBLISHED_RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          then
            printf 'Publish job returned invalid Release identity outputs.\n' >&2
            exit 1
          fi
          verify_required_release initial

          for attempt in 1 2 3; do
            if ! select_latest "before-$attempt"; then
              printf 'Latest selection failed before attempt %s.\n' "$attempt" >&2
              exit 1
            fi
            latest_tag="$SELECTED_TAG"
            latest_commit="$SELECTED_COMMIT"
            latest_id="$SELECTED_ID"
            exact_remote_tag "$latest_tag" "$latest_commit"
            check_workflow_scope "$latest_tag" "$latest_commit" "Latest-$attempt"
            latest_request="$RUNNER_TEMP/latest-request-$attempt.json"
            printf '{"make_latest":"true"}' > "$latest_request"
            latest_response="$RUNNER_TEMP/latest-response-$attempt.json"
            if ! gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$latest_id" \
              --input "$latest_request" > "$latest_response"
            then
              printf 'Failed to mark verified Release ID as Latest: %s (%s)\n' "$latest_id" "$latest_tag" >&2
              exit 1
            fi
            python3 -I -S "$tool" validate-record \
              --release "$latest_response" --tag "$latest_tag" --state final --id "$latest_id"

            if ! select_latest "after-$attempt"; then
              printf 'Latest verification selection failed after attempt %s.\n' "$attempt" >&2
              exit 1
            fi
            verified_tag="$SELECTED_TAG"
            verified_commit="$SELECTED_COMMIT"
            verified_id="$SELECTED_ID"
            actual_latest_json="$RUNNER_TEMP/actual-latest-$attempt.json"
            if ! gh api "repos/$GITHUB_REPOSITORY/releases/latest" > "$actual_latest_json"; then
              printf 'Latest Release readback failed.\n' >&2
              exit 1
            fi
            set +e
            python3 -I -S "$tool" validate-record \
              --release "$actual_latest_json" --tag "$verified_tag" --state final --id "$verified_id"
            actual_latest_status=$?
            set -e
            if [[ "$actual_latest_status" -eq 0 \
              && "$verified_tag" == "$latest_tag" \
              && "$verified_commit" == "$latest_commit" \
              && "$verified_id" == "$latest_id" ]]
            then
              exact_remote_tag "$verified_tag" "$verified_commit"
              verify_required_release final
              printf 'Latest Release verified by ID: %s (%s)\n' "$verified_tag" "$verified_id"
              exit 0
            fi
            if [[ "$actual_latest_status" -ne 0 && "$actual_latest_status" -ne 10 ]]; then
              printf 'Latest Release readback schema or parser validation failed.\n' >&2
              exit "$actual_latest_status"
            fi
            sleep "$attempt"
          done

          printf 'Latest Release state did not stabilize after three attempts.\n' >&2
          exit 1
